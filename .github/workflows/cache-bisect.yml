# Test builds for the Total Commander / Windows 95 access violations that
# started with 20261012. Each variant turns off one of the L1 data cache
# features added in that release; every variant is fitted with three seeds
# in parallel and the seed with the best worst-case setup slack is kept.
#
#   nowrap    DCACHE_LINE_WRAP = 0: line fills start at dword 0 (no critical word first)
#   nohuf     no hit-under-fill: VIPT probes wait for the line fill to finish
#   nodirect  no direct fill from a probe miss: misses take the normal CPU port
#   noload    direct fill only for microcode reads (direct loads take the CPU port)
#   noucrd    direct fill only for direct loads (microcode reads take the CPU port)
name: cache-bisect

on:
  push:
    branches: [cache-bisect]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        variant: [noload, noucrd]
        seed: [9, 1, 5]
    name: ${{ matrix.variant }} seed ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4

      - name: CPU core (src/z486 submodule only)
        run: git submodule update --init --depth 1 src/z486

      - name: PLL files of the production profile (85 MHz)
        run: cp -r profiles/production/rtl/. rtl/

      - name: Free disk space for the Quartus image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Apply variant ${{ matrix.variant }}
        shell: bash
        run: |
          set -euo pipefail
          patch_line() {  # file, old text, new text: fail if the text is not there exactly once
            [ "$(grep -cF -- "$2" "$1")" = 1 ] || { echo "::error::'$2' not found once in $1"; exit 1; }
            python3 - "$1" "$2" "$3" <<'EOF'
          import sys
          p, old, new = sys.argv[1:]
          s = open(p).read()
          open(p, "w").write(s.replace(old, new))
          EOF
            grep -nF -- "$3" "$1"
          }
          case "${{ matrix.variant }}" in
            nowrap)
              patch_line z486_mister.sv \
                "localparam DCACHE_LINE_WRAP = 1'b1;" \
                "localparam DCACHE_LINE_WRAP = 1'b0;" ;;
            nohuf)
              patch_line src/z486/l1_cache.sv \
                "wire fill_probe_open = (state == S_FILL) && fill_target_returned;" \
                "wire fill_probe_open = 1'b0;" ;;
            nodirect)
              patch_line src/z486/cache_unit.sv \
                ".vipt_resolve_fill(dcache_vipt_resolve_fill && !dcache_vipt_is_device_mmio)," \
                ".vipt_resolve_fill(1'b0)," ;;
            noload)
              patch_line src/z486/data_access.sv \
                "    ((vipt_load_ex_r.valid && vipt_load_ex_probed_r &&" \
                "    ((1'b0 && vipt_load_ex_r.valid && vipt_load_ex_probed_r &&" ;;
            noucrd)
              patch_line src/z486/data_access.sv \
                "     (ucrd_valid_r && !ucrd_x87_r));" \
                "     (1'b0 && ucrd_valid_r && !ucrd_x87_r));" ;;
          esac
          patch_line z486_mister.qsf \
            "set_global_assignment -name SEED 9" \
            "set_global_assignment -name SEED ${{ matrix.seed }}"

      - name: Quartus 17.0.2
        run: |
          docker run --rm -v "$PWD":/build -w /build theypsilon/quartus-lite-c5:17.0.2.docker0 \
            sh -c '/opt/intelFPGA_lite/quartus/bin/quartus_sh --flow compile z486_mister > build.log 2>&1; echo $? > build.rc'
          tail -5 build.log
          exit $(cat build.rc)

      - name: Timing
        shell: bash
        run: |
          python3 - output_files/z486_mister.sta.summary > setup.txt <<'EOF'
          # Worst slack per clock from sta.summary; the score is the setup slack
          # of the CPU clock, as in the upstream seed_sweep.py.
          import re, sys
          MAIN = "emu|pll|pll_inst|altera_pll_i|general[0].gpll~PLL_OUTPUT_COUNTER|divclk"
          worst, kind, clk = {}, "", ""
          for line in open(sys.argv[1], errors="ignore"):
              line = line.strip()
              m = re.match(r"Type\s+:\s+(.*?)\s*(Setup|Hold)\s+'(.+)'", line)
              if m:
                  kind, clk = m.group(2), m.group(3)
                  continue
              m = re.match(r"Slack\s+:\s+(-?[0-9.]+)", line)
              if m and kind:
                  k = (kind, clk)
                  worst[k] = min(worst.get(k, 1e9), float(m.group(1)))
          for (k, c), v in sorted(worst.items(), key=lambda x: x[1]):
              print(f"{k:5} {v:8.3f}  {c}")
          if ("Setup", MAIN) not in worst:
              sys.exit("CPU clock not found in sta.summary")
          print(f"MAIN setup {worst[('Setup', MAIN)]:.3f} hold {worst.get(('Hold', MAIN), float('nan')):.3f}")
          EOF
          cat setup.txt
          worst=$(awk '/^MAIN/{print $3}' setup.txt)
          hold=$(awk '/^MAIN/{print $5}' setup.txt)
          echo "CPU clock: setup $worst ns, hold $hold ns" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice::${{ matrix.variant }} seed ${{ matrix.seed }}: CPU clock setup $worst ns, hold $hold ns"
          echo "$worst" > slack.txt
          mkdir -p out
          cp output_files/z486_mister.rbf output_files/z486_mister.sta.summary out/
          cp slack.txt setup.txt out/

      - name: Errors and end of log
        if: failure()
        run: |
          grep -E "^Error( \(|:)" build.log | head -20 | sed 's/^/::error::/' || true
          tail -40 build.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-seed${{ matrix.seed }}
          path: out/
          retention-days: 7

  pick:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [noload, noucrd]
    name: best ${{ matrix.variant }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.variant }}-seed*
          path: seeds

      - name: Keep the seed with the best timing
        shell: bash
        run: |
          set -euo pipefail
          best=""; best_slack=""
          for d in seeds/*/; do
            s=$(cat "$d/slack.txt")
            echo "$(basename "$d"): $s ns" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -z "$best" ] || awk -v a="$s" -v b="$best_slack" 'BEGIN{exit !(a>b)}'; then
              best=$d; best_slack=$s
            fi
          done
          [ -n "$best" ] || { echo "::error::no successful build"; exit 1; }
          seed=$(basename "$best" | sed 's/.*seed//')
          mkdir -p sd/_Computer
          cp "$best/z486_mister.rbf" "sd/_Computer/z486_${{ matrix.variant }}_$(date +%Y%m%d).rbf"
          echo "picked seed $seed ($best_slack ns)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice::${{ matrix.variant }}: seed $seed, worst setup slack $best_slack ns"

      - uses: actions/upload-artifact@v4
        with:
          name: z486_${{ matrix.variant }}
          path: sd/
