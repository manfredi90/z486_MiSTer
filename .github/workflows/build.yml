# Unmodified core, built with Quartus 17.0.2 Lite and the release seed (9).
name: build

on:
  push:
    branches: [ci-baseline]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: CPU core (src/z486 submodule only)
        run: git submodule update --init --depth 1 src/z486

      - name: PLL files of the production profile (85 MHz)
        run: cp -r profiles/production/rtl/. rtl/

      - name: Free disk space for the Quartus image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Quartus 17.0.2
        run: |
          docker run --rm -v "$PWD":/build -w /build theypsilon/quartus-lite-c5:17.0.2.docker0 \
            sh -c '/opt/intelFPGA_lite/quartus/bin/quartus_sh --flow compile z486_mister > build.log 2>&1; echo $? > build.rc'
          tail -5 build.log
          exit $(cat build.rc)

      - name: Timing
        run: |
          grep -A12 "Slow 1100mV 85C Model Setup Summary" output_files/z486_mister.sta.rpt | grep -E "^; [^;]+; -?[0-9]" || true
          mkdir -p sd/_Computer
          cp output_files/z486_mister.rbf sd/_Computer/z486_baseline_$(date +%Y%m%d).rbf

      - name: Errors and end of log
        if: failure()
        run: |
          grep -E "^Error( \(|:)" build.log | head -20 || true
          tail -40 build.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: z486_baseline
          path: sd/
